name: Security

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write        # dependency-review needs this to post PR comments
  security-events: write      # needed to upload SARIF if ever added

jobs:
  # ── Runs on PRs only ─────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Block merge if any new dep introduces a high or critical CVE
          fail-on-severity: high
          # Allow known dev-only moderate CVEs (ajv via eslint, esbuild via vitest)
          allow-ghsas: >-
            GHSA-2g4f-4pwh-qvx6,
            GHSA-67mh-4wv8-2f99,
            GHSA-3ppc-4f35-3m26,
            GHSA-qwww-vcr4-c8h2

  # ── Runs on PRs + pushes to main/dev ─────────────────────────────────────────
  audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (high + critical only)
        run: npx audit-ci --config .audit-ci.jsonc
